openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Nexus Messaging API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: conversations
  - name: channels
  - name: feed
  - name: stories
  - name: upload
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/me:
    put:
      operationId: updateMe
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/me/status:
    put:
      operationId: updateMyStatus
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusInput"
      responses:
        "200":
          description: Updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /users/{userId}:
    get:
      operationId: getUserById
      tags: [users]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /conversations:
    get:
      operationId: getConversations
      tags: [conversations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    put:
      operationId: updateConversation
      tags: [conversations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationInput"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    delete:
      operationId: deleteConversation
      tags: [conversations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /conversations/{id}/messages:
    get:
      operationId: getMessages
      tags: [conversations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [conversations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /conversations/{id}/members:
    get:
      operationId: getMembers
      tags: [conversations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: addMember
      tags: [conversations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
              required: [userId]
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /channels/search:
    get:
      operationId: searchChannels
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
  /feed/videos:
    get:
      operationId: getVideos
      tags: [feed]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
  /stories:
    get:
      operationId: getStories
      tags: [stories]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryGroup"
  /upload:
    post:
      operationId: uploadFile
      tags: [upload]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        bio:
          type: string
        age:
          type: integer
        avatarUrl:
          type: string
        statusText:
          type: string
        statusType:
          type: string
        isOnline:
          type: boolean
        lastSeen:
          type: string
        createdAt:
          type: string
      required: [id, username, displayName, createdAt]
    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: integer
        senderName:
          type: string
        senderAvatar:
          type: string
        content:
          type: string
        type:
          type: string
        mediaUrl:
          type: string
        mediaSize:
          type: integer
        mediaName:
          type: string
        replyTo:
          $ref: "#/components/schemas/Message"
        isEdited:
          type: boolean
        isDeleted:
          type: boolean
        createdAt:
          type: string
      required: [id, conversationId, senderId, type, createdAt]
    Conversation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        name:
          type: string
        description:
          type: string
        avatarUrl:
          type: string
        isPrivate:
          type: boolean
        membersCount:
          type: integer
        unreadCount:
          type: integer
        lastMessage:
          $ref: "#/components/schemas/Message"
        otherUser:
          $ref: "#/components/schemas/User"
        myRole:
          type: string
        createdAt:
          type: string
      required: [id, type, createdAt]
    Member:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        user:
          $ref: "#/components/schemas/User"
        joinedAt:
          type: string
      required: [id, userId, conversationId, role, joinedAt]
    Video:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        userAvatar:
          type: string
        title:
          type: string
        description:
          type: string
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
        likesCount:
          type: integer
        viewsCount:
          type: integer
        commentsCount:
          type: integer
        isLiked:
          type: boolean
        createdAt:
          type: string
      required: [id, userId, videoUrl, createdAt]
    StoryGroup:
      type: object
      properties:
        userId:
          type: integer
        userName:
          type: string
        userAvatar:
          type: string
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
        hasUnviewed:
          type: boolean
      required: [userId, userName, stories]
    Story:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        contentUrl:
          type: string
        contentType:
          type: string
        text:
          type: string
        expiresAt:
          type: string
        viewed:
          type: boolean
        createdAt:
          type: string
      required: [id, userId, contentUrl, contentType, createdAt]
    UploadResponse:
      type: object
      properties:
        url:
          type: string
        type:
          type: string
        size:
          type: integer
        name:
          type: string
      required: [url, type]
    RegisterInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        displayName:
          type: string
      required: [username, password, displayName]
    LoginInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]
    UpdateUserInput:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        age:
          type: integer
        avatarUrl:
          type: string
    UpdateStatusInput:
      type: object
      properties:
        statusText:
          type: string
        statusType:
          type: string
      required: [statusText, statusType]
    CreateConversationInput:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
        description:
          type: string
        avatarUrl:
          type: string
        isPrivate:
          type: boolean
        memberIds:
          type: array
          items:
            type: integer
        targetUserId:
          type: integer
      required: [type]
    UpdateConversationInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        avatarUrl:
          type: string
        isPrivate:
          type: boolean
        noMessages:
          type: boolean
        noLinks:
          type: boolean
        noFiles:
          type: boolean
    SendMessageInput:
      type: object
      properties:
        content:
          type: string
        type:
          type: string
        mediaUrl:
          type: string
        mediaSize:
          type: integer
        mediaName:
          type: string
        mediaMime:
          type: string
        replyToId:
          type: integer
      required: [type]
