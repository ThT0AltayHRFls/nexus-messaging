name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore nexus-release.keystore \
            -alias nexus \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nexus_store_pass \
            -keypass nexus_key_pass \
            -dname "CN=Nexus, OU=AltayHR, O=NexusApp, L=Istanbul, S=Istanbul, C=TR"

      - name: Expo Prebuild (Android)
        working-directory: artifacts/nexus-app
        env:
          EXPO_NO_GIT_STATUS: '1'
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
          EXPO_PUBLIC_DOMAIN: 'localhost'
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Copy keystore & configure signing
        working-directory: artifacts/nexus-app
        run: |
          cp ../../nexus-release.keystore android/app/nexus-release.keystore
          cat >> android/gradle.properties << 'EOF'
          MYAPP_UPLOAD_STORE_FILE=nexus-release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=nexus
          MYAPP_UPLOAD_STORE_PASSWORD=nexus_store_pass
          MYAPP_UPLOAD_KEY_PASSWORD=nexus_key_pass
          EOF

      - name: Patch build.gradle for release signing
        working-directory: artifacts/nexus-app/android
        run: |
          node - << 'JSEOF'
          const fs = require('fs');
          let content = fs.readFileSync('app/build.gradle', 'utf8');

          // 1. Insert signingConfigs block right before buildTypes
          const signingBlock = `
              signingConfigs {
                  release {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
              }
          `;

          // Find buildTypes position and insert before it
          const buildTypesIdx = content.indexOf('    buildTypes {');
          if (buildTypesIdx === -1) {
            console.error('ERROR: Could not find buildTypes block');
            process.exit(1);
          }
          content = content.slice(0, buildTypesIdx) + signingBlock + content.slice(buildTypesIdx);

          // 2. Find release block INSIDE buildTypes (search after buildTypes position)
          // After insertion, find buildTypes again
          const buildTypesIdx2 = content.indexOf('    buildTypes {');
          const releaseIdx = content.indexOf('        release {', buildTypesIdx2);
          if (releaseIdx === -1) {
            console.error('ERROR: Could not find release block inside buildTypes');
            process.exit(1);
          }
          const insertAfter = releaseIdx + '        release {'.length;
          content = content.slice(0, insertAfter) +
            '\n            signingConfig signingConfigs.release' +
            content.slice(insertAfter);

          fs.writeFileSync('app/build.gradle', content);
          console.log('build.gradle patched successfully');
          JSEOF

      - name: Show patched build.gradle signing section
        working-directory: artifacts/nexus-app/android
        run: |
          grep -A 30 "signingConfigs" app/build.gradle || true
          grep -A 20 "buildTypes" app/build.gradle || true

      - name: Set Gradle JVM args
        working-directory: artifacts/nexus-app/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - name: Build Release APK
        working-directory: artifacts/nexus-app/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp artifacts/nexus-app/android/app/build/outputs/apk/release/app-release.apk \
             nexus-v1.0.0-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk-${{ github.run_number }}
          path: nexus-v1.0.0-release.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "## ✅ Nexus APK Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** Nexus Messaging v1.0.0" >> $GITHUB_STEP_SUMMARY
          echo "**Developer:** AltayHR" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** com.altayhr.nexus" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this run." >> $GITHUB_STEP_SUMMARY
