name: Build and Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Public API URL (overrides the NEXUS_API_URL repository variable)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      # Set NEXUS_SUPABASE_URL under repository variables. The value is used
      # as the public API base URL at build time and is never hardcoded.
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.NEXUS_SUPABASE_URL }}

    steps:
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
           if [[ -z "${EXPO_PUBLIC_API_URL:-}" ]]; then
             echo "::error::NEXUS_SUPABASE_URL repository variable is required."
            exit 1
          fi
          if [[ ! "$EXPO_PUBLIC_API_URL" =~ ^https?:// ]]; then
             echo "::error::NEXUS_SUPABASE_URL must start with http:// or https://."
            exit 1
          fi
           if [[ "$EXPO_PUBLIC_API_URL" =~ ^https?://(localhost|127\.0\.0\.1)(:|/) ]]; then
             echo "::error::A release APK cannot use localhost as its API address."
             exit 1
           fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          set -euo pipefail
           APP_VERSION=$(node -p "require('./artifacts/nexus-app/app.json').expo.version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Nexus v$APP_VERSION"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate release signing key
        shell: bash
        env:
          NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${NEXUS_KEYSTORE_BASE64:-}" ]]; then
            echo "$NEXUS_KEYSTORE_BASE64" | base64 --decode > nexus-release.keystore
            KEY_ALIAS="${NEXUS_KEY_ALIAS:-nexus}"
            STORE_PASSWORD="${NEXUS_KEYSTORE_PASSWORD:?NEXUS_KEYSTORE_PASSWORD is required with NEXUS_KEYSTORE_BASE64}"
            KEY_PASSWORD="${NEXUS_KEY_PASSWORD:?NEXUS_KEY_PASSWORD is required with NEXUS_KEYSTORE_BASE64}"
            echo "Using the repository's persistent signing key."
          else
            # A key is still generated automatically for a first release.
            # Configure the four NEXUS_KEY* secrets before publishing updates
            # that must install over an earlier APK.
            KEY_ALIAS="nexus"
            STORE_PASSWORD="$(openssl rand -hex 24)"
             # The runner's keytool defaults to PKCS12, which requires the
             # private-key password to match the keystore password.
             KEY_PASSWORD="$STORE_PASSWORD"
            echo "::add-mask::$STORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
            keytool -genkeypair \
              -v \
              -keystore nexus-release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Nexus, OU=AltayHR, O=NexusApp, L=Istanbul, S=Istanbul, C=TR"
            echo "A new signing key was generated for this release."
            echo "::warning::Configure NEXUS_KEYSTORE_BASE64, NEXUS_KEY_ALIAS, NEXUS_KEYSTORE_PASSWORD, and NEXUS_KEY_PASSWORD to keep the same signing identity for future APK updates."
          fi

          {
            echo "NEXUS_KEY_ALIAS=$KEY_ALIAS"
            echo "NEXUS_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "NEXUS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Generate Android project
        working-directory: artifacts/nexus-app
        env:
          EXPO_NO_GIT_STATUS: "1"
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Configure release signing and version
        working-directory: artifacts/nexus-app
        shell: bash
        run: |
          set -euo pipefail
          cp ../../nexus-release.keystore android/app/nexus-release.keystore

          cat >> android/gradle.properties << EOF
          MYAPP_UPLOAD_STORE_FILE=nexus-release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=$NEXUS_KEY_ALIAS
          MYAPP_UPLOAD_STORE_PASSWORD=$NEXUS_KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_PASSWORD=$NEXUS_KEY_PASSWORD
          EOF

          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle

          # Expo's generated Gradle file differs between SDK/plugin versions.
          # Configure the signing extension in a second android closure instead
          # of relying on a particular generated signingConfigs layout.
          cat >> android/app/build.gradle <<'GEOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GEOF

          {
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=false"
            echo "android.useAndroidX=true"
          } >> android/gradle.properties

      - name: Build release APK
        working-directory: artifacts/nexus-app/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="nexus-v${APP_VERSION}-release.apk"
          cp artifacts/nexus-app/android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-android-apk-${{ github.run_number }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: Nexus v${{ env.APP_VERSION }} · Build ${{ github.run_number }}
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ env.APK_NAME }}
          body: |
            ## Nexus Messaging Android release

            This stable release was built automatically from `${{ github.sha }}`.

             - Version: `${{ env.APP_VERSION }}`
            - Android package: `com.altayhr.nexus`

            Download the APK below and enable installation from this source on Android if prompted.

      - name: Build summary
        run: |
          {
            echo "## Nexus APK Built Successfully"
            echo ""
            echo "**App:** Nexus Messaging v$APP_VERSION"
            echo "**Package:** com.altayhr.nexus"
            echo "**Release:** v$APP_VERSION-build.${{ github.run_number }}"
            echo "**APK:** $APK_NAME"
          } >> "$GITHUB_STEP_SUMMARY"